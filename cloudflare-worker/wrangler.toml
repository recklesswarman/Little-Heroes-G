name = "little-heroes-free-image-api"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "938feaeb0d1bd6758765519c032e9bb3"

# Cloudflare Workers AI Binding
# Provides access to free models like Stable Diffusion XL & FLUX
[ai]
binding = "AI"

# No shared API key: a key used from a browser is public. Access is controlled by an
# Origin allow-list (see worker.js DEFAULT_ALLOWED_ORIGINS) plus the per-IP rate limit below.
# To override the allowed origins, set a comma-separated ALLOWED_ORIGINS var, e.g.:
# [vars]
# ALLOWED_ORIGINS = "https://example.web.app,https://example.github.io"

# Per-IP rate limit: 30 image requests per 60 seconds.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = true
