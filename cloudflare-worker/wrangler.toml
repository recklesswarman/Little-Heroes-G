name = "little-heroes-free-image-api"
main = "worker.js"
compatibility_date = "2024-09-23"
account_id = "938feaeb0d1bd6758765519c032e9bb3"

# Cloudflare Workers AI Binding
# Provides access to free models like Stable Diffusion XL & FLUX
[ai]
binding = "AI"

[vars]
# IMPORTANT: this value is a placeholder only. Set the real API_KEY as a
# Cloudflare Worker secret instead (wrangler secret put API_KEY), never commit
# it here. Any previously committed key value must be treated as leaked and
# rotated in the Cloudflare dashboard.
API_KEY = "CHANGE_ME_SET_VIA_WRANGLER_SECRET"

[observability]
enabled = true
