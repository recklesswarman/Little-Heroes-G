    }
  </style>
  <script>
    (function () {
      var TARGET = 'https://littleheroes-g1--little-heroes-quest-8842.us-east4.hosted.app';
      function computeTargetUrl(pathname, search, hash) {
        var p = pathname || '/';
        if (p.toLowerCase().indexOf('/little-heroes-g') === 0) {
          p = p.slice('/Little-Heroes-G'.length) || '/';
        }
        if (p.charAt(0) !== '/') p = '/' + p;
        if (p === '/index.html' || p === '/404.html') p = '/';
        return TARGET + p + (search || '') + (hash || '');
      }
      var dest = computeTargetUrl(window.location.pathname, window.location.search, window.location.hash);
      try {
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () {});
        }
      } catch (_) {}
      window.location.replace(dest);
    })();
  </script>
</head>
