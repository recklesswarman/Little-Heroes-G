    <meta name="description" content="Tactile 3D kid-friendly habit tracker, AR Toothbrush Sugar Monster battle, Pet Pen & Evolution Matrix, and Hero Rewards Hub." />
    <meta property="og:title" content="Little Heroes: Quest & Habit Adventure" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body class="bg-[#0F172A] text-white font-['Quicksand',sans-serif] select-none antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('Little Heroes PWA Service Worker registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('Little Heroes PWA Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
