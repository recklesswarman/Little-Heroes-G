<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Little Hero Adventures</title>
  <meta name="description" content="Gamified habit and chore adventures for kids with 3D companions, quests, and rewards." />
  <meta property="og:title" content="Little Hero Adventures" />
  <meta property="og:description" content="Gamified habit and chore adventures for kids with 3D companions, quests, and rewards." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script>
    // Bulletproof PWA Cache-Buster & Service Worker Auto-Updater
    const APP_BUILD_VERSION = 'v3.2.0-digital-rewards-20260930';
    window.__LITTLE_HEROES_VERSION__ = APP_BUILD_VERSION;

    window.forceAppHardRefresh = async function() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }
        localStorage.setItem('little_heroes_app_version', APP_BUILD_VERSION);
      } catch (e) {
        console.warn('Cache purge error:', e);
      }
      window.location.reload(true);
    };

    // Auto-detect version mismatch on page load
    (function() {
      try {
        const storedVersion = localStorage.getItem('little_heroes_app_version');
        if (storedVersion !== APP_BUILD_VERSION) {
          console.log('[PWA] New version detected:', APP_BUILD_VERSION, '(previously: ' + storedVersion + ') - Purging stale caches...');
          if ('caches' in window) {
            caches.keys().then(keys => {
              keys.forEach(k => caches.delete(k));
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(r => r.unregister());
            });
          }
          localStorage.setItem('little_heroes_app_version', APP_BUILD_VERSION);
        }
      } catch (e) {}

      // Register modern Service Worker with updateViaCache: 'none'
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
            .then(reg => {
              reg.update();
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version installed and ready.');
                    }
                  });
                }
              });
            })
            .catch(err => {
              console.warn('[PWA] Service Worker registration skipped:', err);
            });
        });
      }
    })();

    // Auto-recovery for chunk loading or unexpected syntax token errors from stale caches
    window.addEventListener('error', function(e) {
      const msg = (e && e.message) ? String(e.message).toLowerCase() : '';
      if (msg.includes('unexpected token') || msg.includes('loading chunk') || msg.includes('failed to fetch dynamically imported module')) {
        console.warn('[PWA] Stale chunk error detected. Auto-refreshing...', e);
        if (!sessionStorage.getItem('lh_auto_reload_attempted')) {
          sessionStorage.setItem('lh_auto_reload_attempted', '1');
          window.forceAppHardRefresh();
        }
      }
    });
  </script>
</head>
<body class="bg-background text-on-background font-body select-none overflow-x-hidden min-h-screen antialiased" style="background-color: #0b0f19; color: #f8fafc;">
  <div id="app" class="relative min-h-screen flex flex-col justify-between">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f19; color: white; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px;">
      <div style="font-size: 56px; margin-bottom: 16px;">🦖</div>
      <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; letter-spacing: -0.5px;">Little Hero Adventures</h1>
      <p style="font-size: 14px; color: #94a3b8; margin: 0 0 20px 0;">Loading your hero headquarters...</p>
      <div style="width: 140px; height: 6px; background: #1e293b; border-radius: 9999px; overflow: hidden; margin-bottom: 24px;">
        <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #10b981, #06b6d4); border-radius: 9999px;"></div>
      </div>
      <button onclick="window.forceAppHardRefresh()" style="background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; font-size: 12px; cursor: pointer;">
        Tap to Refresh
      </button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
