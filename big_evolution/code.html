<script>
        // Simple Confetti Generator
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const colors = ['#54e98a', '#e89300', '#a3d3ff', '#ffb4ab']; // primary, secondary-container, tertiary, error

            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('confetti-particle');
                
                // Randomize properties
                const size = Math.random() * 10 + 5;
                const left = Math.random() * 100;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const delay = Math.random() * 2;
                const duration = Math.random() * 3 + 2;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}vw`;
                particle.style.backgroundColor = color;
                particle.style.animation = `float-up ${duration}s ease-in-out ${delay}s infinite`;
                
                // Random shapes (circles and squares)
                if (Math.random() > 0.5) {
                    particle.style.borderRadius = '0';
                }

                container.appendChild(particle);
            }
        }

        // Initialize effects on load
        window.onload = () => {
            createConfetti();
        };
    </script>
