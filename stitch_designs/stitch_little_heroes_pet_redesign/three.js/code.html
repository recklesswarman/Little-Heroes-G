export function getPetById(id) {
  if (id === undefined || id === null) return PETS_DATABASE[0];
  const idStr = String(id).toLowerCase().trim();
  return PETS_DATABASE.find(p =>
    String(p.id).toLowerCase() === idStr ||
    p.name.toLowerCase().includes(idStr) ||
    p.name.toLowerCase().replace(/[^a-z0-9]/g, '').includes(idStr.replace(/[^a-z0-9]/g, ''))
  ) || PETS_DATABASE[0];
}

export function getPetArchetype(pet) {
  if (!pet) return PET_ARCHETYPES.dino;
  const key = typeof pet === 'string' ? pet : pet.archetype;
  return (key && PET_ARCHETYPES[key]) ? PET_ARCHETYPES[key] : PET_ARCHETYPES.dino;
}

export function getPetLevelStats(level = 1) {
  const lvl = Math.max(1, Math.min(50, Math.floor(level || 1)));
  const tierIndex = Math.min(4, Math.floor((lvl - 1) / 10) + 1);
  const tierTitles = [
    'Rookie Companion (Lv 1-10)',
    'Playful Buddy (Lv 11-20)',
    'Heroic Partner (Lv 21-30)',
    'Invincible Guardian (Lv 31-40)',
    'Sanctuary Apex Legend (Lv 41-50+)'
  ];

  return {
    level: lvl,
    tier: tierIndex,
    title: tierTitles[tierIndex - 1] || 'Heroic Partner',
    coinMultiplier: 1.0 + (lvl * 0.05), // Scales up to +250% at Lv 50
    bossAssistPower: 15 + (lvl * 3),
    xpToNextLevel: lvl * 150
  };
}
