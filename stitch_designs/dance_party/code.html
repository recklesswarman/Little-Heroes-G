<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pet Dance Party</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&amp;family=Quicksand:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#2b3640",
                        "primary": "#54e98a",
                        "on-surface-variant": "#bbcbbb",
                        "surface-container-low": "#121d26",
                        "tertiary-fixed-dim": "#92ccff",
                        "secondary-container": "#e89300",
                        "background": "#09141e",
                        "on-secondary-container": "#563400",
                        "on-tertiary": "#003351",
                        "outline-variant": "#3d4a3e",
                        "surface-container-high": "#202b35",
                        "tertiary-fixed": "#cce5ff",
                        "secondary-fixed": "#ffddb9",
                        "on-primary": "#003919",
                        "on-tertiary-fixed": "#001d31",
                        "on-secondary": "#472a00",
                        "on-background": "#d8e4f1",
                        "on-secondary-fixed": "#2b1700",
                        "tertiary-container": "#5fbaff",
                        "inverse-primary": "#006d37",
                        "outline": "#869486",
                        "surface-container": "#16212b",
                        "error": "#ffb4ab",
                        "secondary": "#ffb961",
                        "surface-tint": "#4ae183",
                        "surface": "#09141e",
                        "surface-container-lowest": "#050f18",
                        "primary-fixed": "#6bfe9c",
                        "on-tertiary-container": "#004970",
                        "inverse-surface": "#d8e4f1",
                        "primary-fixed-dim": "#4ae183",
                        "surface-container-highest": "#2b3640",
                        "inverse-on-surface": "#27323c",
                        "on-tertiary-fixed-variant": "#004b73",
                        "secondary-fixed-dim": "#ffb961",
                        "surface-dim": "#09141e",
                        "surface-bright": "#2f3a45",
                        "on-error-container": "#ffdad6",
                        "on-primary-container": "#005027",
                        "on-secondary-fixed-variant": "#663e00",
                        "tertiary": "#a3d3ff",
                        "on-primary-fixed-variant": "#005228",
                        "on-error": "#690005",
                        "primary-container": "#2ecc71",
                        "on-surface": "#d8e4f1",
                        "on-primary-fixed": "#00210c",
                        "error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "64px",
                        "base": "8px",
                        "md": "24px",
                        "sm": "12px",
                        "margin-mobile": "20px",
                        "lg": "40px",
                        "xs": "4px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Quicksand"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Quicksand"],
                        "label-xl": ["Quicksand"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "800" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "800" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "label-xl": ["18px", { "lineHeight": "20px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .chunky-btn-primary {
            border-bottom: 8px solid theme('colors.inverse-primary');
            transition: transform 0.1s, border-bottom 0.1s;
        }
        .chunky-btn-primary:active {
            transform: translateY(4px);
            border-bottom: 4px solid theme('colors.inverse-primary');
        }
        .chunky-card {
            border-bottom: 12px solid theme('colors.surface-container-highest');
        }
        .glow-text {
            text-shadow: 0 0 10px theme('colors.secondary'), 0 0 20px theme('colors.secondary');
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating-note {
            animation: float 3s ease-in-out infinite;
        }
        .floating-note:nth-child(2) { animation-delay: 0.5s; }
        .floating-note:nth-child(3) { animation-delay: 1s; }
        .floating-note:nth-child(4) { animation-delay: 1.5s; }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .pop-on-tap:active {
            animation: pop 0.2s ease-out;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden flex flex-col relative">
<!-- Top App Bar (Modified for game context, acting as stats/exit) -->
<header class="flex justify-between items-center px-margin-mobile h-24 w-full bg-surface/80 backdrop-blur-md border-b-4 border-surface-container-highest shadow-[0_4px_0_0_rgba(0,0,0,0.3)] z-50 shrink-0">
<button aria-label="Exit Game" class="flex items-center gap-2 p-2 rounded-full bg-surface-container hover:bg-surface-bright active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-error text-3xl" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
<div class="flex-1 flex justify-center items-center px-4">
<div class="bg-surface-container-high rounded-full w-full max-w-[200px] h-8 relative overflow-hidden border-2 border-outline-variant flex items-center">
<div class="absolute left-0 top-0 h-full bg-secondary-container transition-all duration-300 w-3/4" id="joy-bar"></div>
<div class="relative z-10 w-full text-center font-label-xl text-on-surface glow-text flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">favorite</span>
                    Joy Level
                </div>
</div>
</div>
<button aria-label="Pause" class="flex items-center gap-2 p-2 rounded-full bg-surface-container hover:bg-surface-bright active:translate-y-1 transition-all">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
</header>
<!-- Game Canvas -->
<main class="flex-1 relative w-full h-full">
<!-- Background Image -->
<img alt="Pet Dance Party Background" class="absolute inset-0 w-full h-full object-cover z-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQ8NQc8WlfbXlCYbixFd-qxf-WgQXgs6mnn_B-4JS9gm35Z6gHWNoVaiZVtqtrx4kh9UAwBXLgT8l4Kc2AS3n0XHUFcOmIeZNkdP1MhoHJfRaPaJu5bbz88wBDaX-5zQKCbP9tOG9tQQsWUpZw-MIfDOdiCtvXX5-S_ZRdtzhMCqYT9xFOWIYtw8yOFZgwUKWqqnuiCnYbKcWznyrSUuyBoJ4Ik8CBFOWWmPjc0yRCxtpOciTP_5JwGw"/>
<div class="absolute inset-0 bg-background/30 z-0"></div> <!-- Slight overlay for contrast -->
<!-- Voice Guidance Caption -->
<div class="absolute top-8 left-1/2 -translate-x-1/2 z-20 bg-surface-container-high/90 backdrop-blur-sm border-2 border-primary rounded-xl px-6 py-3 chunky-card text-center min-w-[250px]">
<p class="font-headline-lg-mobile text-primary glow-text">Dance with your hero!</p>
<p class="font-body-md text-on-surface">Tap the stars to the beat!</p>
</div>
<!-- Interactive Beat Notes -->
<div class="absolute inset-0 z-30 pointer-events-none" id="beat-container">
<!-- These would ideally be spawned by JS based on music, placing some static ones for UI mockup -->
<button class="pointer-events-auto absolute top-[30%] left-[20%] floating-note pop-on-tap bg-tertiary-container text-on-tertiary-container rounded-full p-4 shadow-[0_4px_0_0_theme('colors.on-tertiary-container')] active:translate-y-1 active:shadow-none transition-all w-16 h-16 flex items-center justify-center border-2 border-white/50" onclick="hitNote()">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="pointer-events-auto absolute top-[45%] right-[25%] floating-note pop-on-tap bg-secondary-container text-on-secondary-container rounded-full p-4 shadow-[0_4px_0_0_theme('colors.on-secondary-container')] active:translate-y-1 active:shadow-none transition-all w-20 h-20 flex items-center justify-center border-2 border-white/50" onclick="hitNote()">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">music_note</span>
</button>
<button class="pointer-events-auto absolute bottom-[35%] left-[45%] floating-note pop-on-tap bg-primary-container text-on-primary-container rounded-full p-4 shadow-[0_4px_0_0_theme('colors.on-primary-container')] active:translate-y-1 active:shadow-none transition-all w-24 h-24 flex items-center justify-center border-2 border-white/50" onclick="hitNote()">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
</div>
<!-- Confetti/Particle layer (Static visual representation) -->
<div class="absolute inset-0 z-10 pointer-events-none overflow-hidden">
<!-- Simulated static confetti -->
<div class="absolute top-1/4 left-1/4 w-3 h-3 bg-primary rounded-sm rotate-45 opacity-70"></div>
<div class="absolute top-1/3 right-1/4 w-2 h-4 bg-secondary rounded-sm rotate-12 opacity-80"></div>
<div class="absolute bottom-1/4 left-1/3 w-4 h-4 bg-tertiary rounded-full opacity-60"></div>
<div class="absolute top-1/2 right-1/3 w-3 h-3 bg-error rounded-sm rotate-45 opacity-70"></div>
</div>
</main>
<!-- Bottom Controls (Optional, keeping minimal as action is on canvas) -->
<footer class="h-24 bg-surface-container/90 backdrop-blur-md border-t-8 border-surface-container-highest shadow-[0_-8px_0_0_rgba(0,0,0,0.2)] flex justify-center items-center px-4 shrink-0 z-50">
<button class="bg-primary text-on-primary font-headline-lg-mobile py-4 px-12 rounded-xl chunky-btn-primary w-full max-w-sm flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
             FEVER PITCH!
         </button>
</footer>
<script>
        function hitNote() {
            // Simple interaction logic for demo
            const joyBar = document.getElementById('joy-bar');
            let currentWidth = parseInt(joyBar.style.width || '75');
            if(currentWidth < 100) {
                joyBar.style.width = Math.min(100, currentWidth + 5) + '%';
            }
            
            // Create a small particle effect on click (simplified)
            event.target.style.transform = 'scale(0.8)';
            setTimeout(() => {
                event.target.style.transform = '';
                 event.target.style.opacity = '0';
                 setTimeout(() => {
                     // Reset note position somewhere else for demo loop
                     event.target.style.top = Math.random() * 60 + 20 + '%';
                     event.target.style.left = Math.random() * 80 + 10 + '%';
                     event.target.style.opacity = '1';
                 }, 500);
            }, 100);
        }
    </script>
</body></html>
