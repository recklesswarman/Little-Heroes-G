<style>

            border-bottom: 8px solid #005228; /* on-primary-fixed-variant */
            transition: transform 0.1s, border-bottom 0.1s;

        .chunky-button-primary:active {
            transform: translateY(4px);
            border-bottom: 4px solid #005228;
        }
        
        .chunky-button-secondary {
            border-bottom: 4px solid #003351; /* on-tertiary */
            transition: transform 0.1s, border-bottom 0.1s;
        }
        .chunky-button-secondary:active {
            transform: translateY(2px);
            border-bottom: 2px solid #003351;
        }

        .floating-card {
            box-shadow: 0 8px 0 0 #050f18; /* surface-container-lowest */
        }
        
        /* Progress Bar Animation */
        #hygiene-fill {
            transition: width 0.3s ease-in-out;
        }

        /* Bubble Animation */
        .bubble {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

<body class="bg-background text-on-background font-body-md min-h-screen pb-24 md:pb-0 flex flex-col">

</button>
<div class="flex items-center gap-xs">
<img class="w-10 h-10 rounded-full object-cover border-2 border-primary" data-alt="A stylized 3D avatar of a young child adventurer wearing a safari hat and goggles, rendered in a colorful, tactile toy-like aesthetic suitable for a children's app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDMAcmnC8ZO3IDKFsfsTF_ga6AUiKmVc2cMSkJI11M4C-dKbrRagz6n_ZZXtLxyfLUMDBrND-CH8Cjsak1KAfpyRl8yV1fxgiCbnLAihgXUuwbvwIQIcXJhvFOMaAyyNDUybZR8OF7p29Ol_rnexfv5b7cv_cuGMvHoc6x6vlx_TCXcAGHnkkLusJfNyBYLkYgV2B97bHDSel1nFXtH88vJ2yWmS5kiihE7kcemz3XMTx8fLED_mhJALQ"/>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-black text-secondary">Quest Hero</span>
</div>
</div>
<div class="flex items-center">
<button class="bg-surface-container rounded-lg px-4 py-2 flex items-center gap-2 chunky-button-secondary border-b-4 border-surface-container-lowest text-on-surface-variant font-label-xl hover:bg-surface-bright active:translate-y-1 transition-all">
<span class="material-symbols-outlined">lock</span>
                Parent Lock
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-start p-margin-mobile gap-lg overflow-hidden relative">
<!-- Hygiene Progress Bar (Top) -->
<div class="w-full max-w-md floating-card bg-surface-container rounded-xl p-4 border-2 border-surface-container-high flex flex-col gap-2 z-10 mt-sm">
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<span class="font-label-xl text-on-surface">Hygiene Level</span>
</div>
<span class="font-label-xl text-primary font-bold" id="hygiene-text">0%</span>
</div>
<div class="w-full h-8 bg-surface-container-lowest rounded-full border-2 border-surface-container-highest overflow-hidden relative shadow-inner">
<div class="h-full bg-tertiary-container w-0 rounded-full relative" id="hygiene-fill">
<!-- Liquid effect highlight -->
<div class="absolute top-0 left-0 w-full h-2 bg-white opacity-20 rounded-t-full"></div>
</div>
</div>
</div>
<!-- Centerpiece: Bathtub Scene -->
<div class="relative w-full max-w-2xl aspect-[4/3] rounded-3xl overflow-hidden border-4 border-surface-container-high floating-card mt-md">
<!-- Background Image Placeholder for 3D Bathtub -->
<img alt="3D Bathtub" class="absolute inset-0 w-full h-full object-cover z-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChCspQJaFH62vAmvxMah1FV4FgomNnC8x3Tnh67gupQHMYn0IYswagfoUX4wVhG4PzCe6LiuaedtoZCzRE56GXk2W-pMRmjPBVBtyuv6EAmkHp8WsmHe9jR2dktxmxVOqHg4slRh8MPUpU6q8OMVQT4ON4aguf7H0uB0ekBz8nY7ZeOrxg2JjAWTWsSAR6PfsCaJr69gNykFdz99qlR4J50p3KlYhK1MiPDgaZWWFe4yq4b18oRRPlWA"/>
<!-- Interactive Overlay Elements (Bubbles/Sparkles) -->
<div class="absolute inset-0 z-10 pointer-events-none" id="interactive-layer">
<!-- Javascript will spawn bubbles here based on interaction -->
</div>
</div>
<!-- Voice Guidance Caption -->
<div class="bg-surface-container-high border-2 border-surface-variant rounded-xl p-4 max-w-md text-center floating-card z-10 mx-auto w-full">
<p class="font-body-lg text-secondary-fixed" id="voice-caption">
<span class="material-symbols-outlined align-middle mr-2 text-secondary">record_voice_over</span>
                "Let's get all those bubbles! Tap to scrub!"
            </p>
</div>
<!-- Interactive Controls (Thumb Zone) -->
<div class="w-full max-w-md flex flex-col gap-sm z-10 mt-auto pb-lg">
<!-- Scrub Stage Actions -->
<div class="flex gap-4 w-full" id="scrub-actions">
<button class="flex-1 bg-primary text-on-primary font-headline-lg-mobile rounded-xl py-4 flex flex-col items-center justify-center chunky-button-primary hover:bg-primary-fixed transition-colors" onclick="performScrub()">
<span class="material-symbols-outlined text-4xl mb-1" style="font-variation-settings: 'FILL' 1;">wash</span>
<span>Scrub!</span>
</button>
</div>

<div class="hidden flex gap-4 w-full" id="dry-actions">
<button class="flex-1 bg-tertiary-container text-on-tertiary-container font-headline-lg-mobile rounded-xl py-4 flex flex-col items-center justify-center chunky-button-primary border-b-[8px] border-on-tertiary-fixed-variant hover:bg-tertiary transition-colors" onclick="performDry()" style="border-bottom-color: #004b73;">

<span>Blow Dry</span>
</button>
</div>

<!-- Bottom Navigation (Shared Component Shell) -->

<nav class="bg-surface-container dark:bg-surface-container font-label-xl text-label-xl docked full-width bottom-0 rounded-t-xl border-t-8 border-surface-container-highest shadow-[0_-8px_0_0_rgba(0,0,0,0.2)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-end px-4 pb-4 h-24 md:hidden">

<span class="text-xs">Tasks</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:bg-surface-bright transition-all duration-100 ease-out w-16">
<span class="material-symbols-outlined text-3xl mb-1">shopping_basket</span>
<span class="text-xs">Shop</span>
</button>
<!-- Active Tab: Pets (Matches context of Pet Bath Time) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-2 mb-2 translate-y-[-8px] border-b-4 border-on-primary-fixed-variant transition-all duration-100 ease-out w-20 shadow-md">
<span class="material-symbols-outlined text-3xl mb-1 text-on-primary-container" style="font-variation-settings: 'FILL' 1;">pets</span>
<span class="text-sm font-bold">Pets</span>
</button>
</nav>
<script>
        let hygiene = 0;
        let isDryStage = false;
        const maxHygiene = 100;
        const hygieneFill = document.getElementById('hygiene-fill');
        const hygieneText = document.getElementById('hygiene-text');
        const scrubActions = document.getElementById('scrub-actions');
        const dryActions = document.getElementById('dry-actions');
        const voiceCaption = document.getElementById('voice-caption');
        const interactiveLayer = document.getElementById('interactive-layer');

        function createBubbleEffect() {
            const bubble = document.createElement('div');
            bubble.classList.add('absolute', 'w-8', 'h-8', 'bg-tertiary-fixed', 'rounded-full', 'opacity-60', 'bubble', 'border-2', 'border-white');
            // Random position within bottom half
            const left = Math.random() * 80 + 10; 
            const bottom = Math.random() * 40 + 10;
            
            bubble.style.left = `${left}%`;
            bubble.style.bottom = `${bottom}%`;
            
            // Highlight
            const highlight = document.createElement('div');
            highlight.classList.add('absolute', 'w-2', 'h-2', 'bg-white', 'rounded-full', 'top-1', 'left-1');
            bubble.appendChild(highlight);

            interactiveLayer.appendChild(bubble);

            // Remove after animation
            setTimeout(() => {
                bubble.remove();
            }, 4000);
        }

        function performScrub() {
            if (isDryStage) return;
            
            hygiene += 15;
            if (hygiene > maxHygiene) hygiene = maxHygiene;
            
            updateHygieneBar();
            createBubbleEffect();
            createBubbleEffect();
            
            // Add slight jiggle to tub (visual feedback)
            const tubImg = document.querySelector('img[alt="3D Bathtub"]');
            if(tubImg) {
                tubImg.style.transform = 'scale(1.02)';
                setTimeout(() => tubImg.style.transform = 'scale(1)', 100);
            }

            if (hygiene >= maxHygiene) {
                transitionToDryStage();
            }
        }

        function performDry() {
            // Visual effect for drying
            interactiveLayer.innerHTML = ''; // Clear bubbles
            const wind = document.createElement('div');
            wind.classList.add('absolute', 'inset-0', 'bg-white', 'opacity-30', 'transition-opacity', 'duration-500');
            interactiveLayer.appendChild(wind);
            
            setTimeout(() => {
                wind.style.opacity = '0';
                setTimeout(() => wind.remove(), 500);
            }, 200);

            voiceCaption.innerHTML = `<span class="material-symbols-outlined align-middle mr-2 text-primary">task_alt</span> All clean and dry! Great job!`;
            voiceCaption.classList.replace('text-secondary-fixed', 'text-primary');
            
            // Completing the task could redirect or show reward
        }

        function updateHygieneBar() {
            hygieneFill.style.width = `${hygiene}%`;
            hygieneText.innerText = `${Math.floor(hygiene)}%`;
        }

        function transitionToDryStage() {
            isDryStage = true;
            scrubActions.classList.add('hidden');
            dryActions.classList.remove('hidden');
            
            voiceCaption.innerHTML = `<span class="material-symbols-outlined align-middle mr-2 text-tertiary">air</span> "Squeaky clean! Now let's dry off!"`;
            
            // Change progress bar color to indicate a new phase
            hygieneFill.classList.replace('bg-tertiary-container', 'bg-primary');
        }
    </script>
