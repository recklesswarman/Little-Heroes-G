name: Deploy Vite App to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      # Same as ci.yml: the Pi voice service check needs Python with numpy.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install --quiet numpy
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: '/Little-Heroes-G/'
          VITE_IMAGE_GEN_API_URL: 'https://little-heroes-free-image-api.recklesswarman.workers.dev'
          # Static host: call App Hosting's server for /api routes (Gemini key stays there).
          VITE_SERVER_API_BASE: 'https://littleheroes-g1--little-heroes-quest-8842.us-east4.hosted.app'
          # Parent chore/reward alerts straight to the family Pi's ntfy (Tailscale Funnel).
          # The token is publish-only for the little-heroes topic, so it is safe in the bundle.
          VITE_NTFY_PUBLIC_URL: ${{ vars.NTFY_PUBLIC_URL }}
          VITE_NTFY_PUBLISH_TOKEN: ${{ secrets.NTFY_PUBLISH_TOKEN }}
          # Cookie-free Umami analytics on the Pi (tracker + /api/send only, via Funnel)
          VITE_UMAMI_HOST: ${{ vars.UMAMI_HOST }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Check the live sites AFTER deploying (never before: a broken live site must not block the deploy that repairs it).
      # Shown as a warning when something is off; it does not fail the deployment.
      - name: Verify the live sites
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PARITY_LIVE: '1'
        run: |
          sleep 60
          node scratch/verify_multi_host_parity.mjs
