name: Deploy Redirect to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify redirect bundle
        run: test -f redirect/index.html && test -f redirect/404.html && test -f redirect/sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './redirect'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Check the live sites AFTER deploying (never before: a broken live site must not block the deploy that repairs it).
      # Shown as a warning when something is off; it does not fail the deployment.
      - name: Verify the live sites
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PARITY_LIVE: '1'
        run: |
          sleep 45
          node scratch/verify_multi_host_parity.mjs
