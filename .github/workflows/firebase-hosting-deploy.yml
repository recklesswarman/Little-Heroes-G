name: Deploy to Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "firebase-hosting"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: '/'
          TARGET_HOST: 'firebase'
          VITE_IMAGE_GEN_API_URL: 'https://little-heroes-free-image-api.recklesswarman.workers.dev'
          # Parent chore/reward alerts straight to the family Pi's ntfy (Tailscale Funnel).
          # The token is publish-only for the little-heroes topic, so it is safe in the bundle.
          VITE_NTFY_PUBLIC_URL: ${{ vars.NTFY_PUBLIC_URL }}
          VITE_NTFY_PUBLISH_TOKEN: ${{ secrets.NTFY_PUBLISH_TOKEN }}
      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: little-heroes-quest-8842
          channelId: live
      # Check the live sites AFTER deploying (never before: a broken live site must not block the deploy that repairs it).
      - name: Verify the live sites
        if: steps.firebase_deploy.outcome == 'success'
        continue-on-error: true
        env:
          PARITY_LIVE: '1'
        run: |
          sleep 30
          node scratch/verify_multi_host_parity.mjs
