name: Deploy Redirect to Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "firebase-hosting"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      checks: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare redirect bundle
        run: |
          rm -rf dist
          cp -R redirect dist
          test -f dist/index.html && test -f dist/404.html && test -f dist/sw.js
      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: little-heroes-quest-8842
          channelId: live
      # Check the live sites AFTER deploying (never before: a broken live site must not block the deploy that repairs it).
      - name: Verify the live sites
        if: steps.firebase_deploy.outcome == 'success'
        continue-on-error: true
        env:
          PARITY_LIVE: '1'
        run: |
          sleep 30
          node scratch/verify_multi_host_parity.mjs
