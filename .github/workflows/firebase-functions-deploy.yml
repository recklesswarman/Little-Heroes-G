name: Deploy Firebase Functions

on:
  push:
    branches: ["main"]
    paths:
      - "functions/**"
      - "functions-ledger/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
  workflow_dispatch:

concurrency:
  group: "firebase-functions"
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            functions-ledger/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Lint functions
        working-directory: functions
        run: npm run lint

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Install ledger function dependencies
        working-directory: functions-ledger
        run: npm ci

      - name: Lint ledger functions
        working-directory: functions-ledger
        run: npm run lint

      - name: Build ledger functions
        working-directory: functions-ledger
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"

      - name: Show which service account is deploying
        run: |
          echo "Deploying as: $(jq -r '.client_email // "unknown"' "$GOOGLE_APPLICATION_CREDENTIALS")"

      - name: Deploy Firebase Functions, Firestore Rules & Indexes
        run: npx firebase-tools@latest deploy --only functions,firestore:rules,firestore:indexes --project little-heroes-quest-8842 --non-interactive
