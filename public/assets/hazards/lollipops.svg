<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="candyShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="popGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Stick -->
  <rect x="246" y="220" width="20" height="260" rx="10" fill="url(#stickGrad)" transform="rotate(-15, 256, 350)"/>
  
  <!-- Lollipop Candy Disc -->
  <g transform="translate(256, 175) rotate(25)" filter="url(#popGlow)">
    <!-- Base Disc -->
    <circle cx="0" cy="0" r="145" fill="#f43f5e"/>
    
    <!-- Colorful Swirl Spirals -->
    <!-- Yellow Swirl -->
    <path d="M 0 0 Q 35 -65 110 -40 Q 145 -10 142 30 Q 130 95 65 130 Q 0 155 -60 130 Q -135 90 -142 0 Q -140 -80 -70 -130 Q 0 -155 70 -135 Q 135 -105 145 -30" stroke="#facc15" stroke-width="26" fill="none" stroke-linecap="round"/>
    
    <!-- Sky Blue Swirl -->
    <path d="M 0 0 Q -50 35 -70 90 Q -80 135 -30 145 Q 40 150 95 110 Q 145 60 135 -10 Q 120 -80 60 -125 Q -10 -150 -75 -125 Q -135 -85 -140 -15 Q -135 60 -90 115" stroke="#38bdf8" stroke-width="24" fill="none" stroke-linecap="round"/>
    
    <!-- Lime Green Swirl -->
    <path d="M 0 0 Q 40 30 75 10 Q 115 -25 90 -75 Q 60 -125 -10 -135 Q -80 -135 -120 -80 Q -150 -15 -120 50 Q -85 115 -15 138 Q 60 145 115 95" stroke="#4ade80" stroke-width="20" fill="none" stroke-linecap="round"/>

    <!-- Purple Swirl -->
    <path d="M 0 0 Q -30 -40 -15 -75 Q 10 -115 65 -90 Q 115 -60 130 5 Q 135 75 80 120 Q 20 150 -45 130 Q -115 95 -135 30 Q -140 -40 -95 -95" stroke="#a855f7" stroke-width="18" fill="none" stroke-linecap="round"/>

    <!-- White Sugar Ribbon -->
    <path d="M 0 0 Q 20 -25 50 -15 Q 80 0 75 40 Q 60 85 10 95 Q -40 95 -75 60 Q -95 10 -70 -40 Q -35 -80 20 -85 Q 75 -80 105 -35" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- 3D Spherical Specular Gloss Overlay -->
    <circle cx="0" cy="0" r="145" fill="url(#candyShine)"/>
    <ellipse cx="-45" cy="-55" rx="45" ry="24" transform="rotate(-35, -45, -55)" fill="#ffffff" opacity="0.6"/>
    <circle cx="-65" cy="-75" r="10" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
