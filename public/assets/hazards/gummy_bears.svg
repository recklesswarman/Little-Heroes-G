<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="redGummy" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="25%" stop-color="#f43f5e"/>
      <stop offset="85%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="greenGummy" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="25%" stop-color="#22c55e"/>
      <stop offset="85%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="goldGummy" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Main Red Bear in Center -->
  <g transform="translate(156, 120) scale(1.1)" filter="url(#glow)">
    <!-- Ears -->
    <circle cx="45" cy="50" r="28" fill="url(#redGummy)"/>
    <circle cx="155" cy="50" r="28" fill="url(#redGummy)"/>
    <circle cx="45" cy="50" r="14" fill="#fda4af" opacity="0.6"/>
    <circle cx="155" cy="50" r="14" fill="#fda4af" opacity="0.6"/>
    
    <!-- Head -->
    <ellipse cx="100" cy="85" rx="65" ry="55" fill="url(#redGummy)"/>
    
    <!-- Muzzle -->
    <ellipse cx="100" cy="100" rx="35" ry="25" fill="#fda4af" opacity="0.8"/>
    <!-- Nose & Mouth -->
    <ellipse cx="100" cy="94" rx="14" ry="10" fill="#881337"/>
    <path d="M 94 104 Q 100 112 106 104" stroke="#881337" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="78" cy="78" r="8" fill="#4c0519"/>
    <circle cx="76" cy="75" r="3" fill="#ffffff"/>
    <circle cx="122" cy="78" r="8" fill="#4c0519"/>
    <circle cx="120" cy="75" r="3" fill="#ffffff"/>
    
    <!-- Body -->
    <path d="M 50 120 C 30 180 35 240 70 255 C 80 260 120 260 130 255 C 165 240 170 180 150 120 Z" fill="url(#redGummy)"/>
    <!-- Belly -->
    <ellipse cx="100" cy="190" rx="42" ry="48" fill="#fda4af" opacity="0.4"/>
    
    <!-- Arms -->
    <ellipse cx="40" cy="165" rx="22" ry="40" transform="rotate(25, 40, 165)" fill="url(#redGummy)"/>
    <ellipse cx="160" cy="165" rx="22" ry="40" transform="rotate(-25, 160, 165)" fill="url(#redGummy)"/>
    
    <!-- Legs -->
    <ellipse cx="65" cy="255" rx="26" ry="32" fill="url(#redGummy)"/>
    <ellipse cx="135" cy="255" rx="26" ry="32" fill="url(#redGummy)"/>
    
    <!-- Gloss Highlights -->
    <ellipse cx="75" cy="65" rx="18" ry="8" transform="rotate(-20, 75, 65)" fill="#ffffff" opacity="0.6"/>
    <ellipse cx="70" cy="160" rx="22" ry="8" transform="rotate(-60, 70, 160)" fill="#ffffff" opacity="0.5"/>
    <circle cx="70" cy="245" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="140" cy="245" r="8" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- Small Green Bear Bouncing Left -->
  <g transform="translate(40, 220) scale(0.65) rotate(-20)" opacity="0.95">
    <circle cx="45" cy="50" r="28" fill="url(#greenGummy)"/>
    <circle cx="155" cy="50" r="28" fill="url(#greenGummy)"/>
    <ellipse cx="100" cy="85" rx="65" ry="55" fill="url(#greenGummy)"/>
    <ellipse cx="100" cy="100" rx="35" ry="25" fill="#86efac" opacity="0.8"/>
    <ellipse cx="100" cy="94" rx="14" ry="10" fill="#14532d"/>
    <circle cx="78" cy="78" r="8" fill="#052e16"/>
    <circle cx="76" cy="75" r="3" fill="#ffffff"/>
    <circle cx="122" cy="78" r="8" fill="#052e16"/>
    <circle cx="120" cy="75" r="3" fill="#ffffff"/>
    <path d="M 50 120 C 30 180 35 240 70 255 C 80 260 120 260 130 255 C 165 240 170 180 150 120 Z" fill="url(#greenGummy)"/>
    <ellipse cx="40" cy="165" rx="22" ry="40" transform="rotate(35, 40, 165)" fill="url(#greenGummy)"/>
    <ellipse cx="160" cy="165" rx="22" ry="40" transform="rotate(-35, 160, 165)" fill="url(#greenGummy)"/>
    <ellipse cx="65" cy="255" rx="26" ry="32" fill="url(#greenGummy)"/>
    <ellipse cx="135" cy="255" rx="26" ry="32" fill="url(#greenGummy)"/>
  </g>

  <!-- Small Gold Bear Bouncing Right -->
  <g transform="translate(340, 210) scale(0.65) rotate(20)" opacity="0.95">
    <circle cx="45" cy="50" r="28" fill="url(#goldGummy)"/>
    <circle cx="155" cy="50" r="28" fill="url(#goldGummy)"/>
    <ellipse cx="100" cy="85" rx="65" ry="55" fill="url(#goldGummy)"/>
    <ellipse cx="100" cy="100" rx="35" ry="25" fill="#fef08a" opacity="0.8"/>
    <ellipse cx="100" cy="94" rx="14" ry="10" fill="#713f12"/>
    <circle cx="78" cy="78" r="8" fill="#422006"/>
    <circle cx="76" cy="75" r="3" fill="#ffffff"/>
    <circle cx="122" cy="78" r="8" fill="#422006"/>
    <circle cx="120" cy="75" r="3" fill="#ffffff"/>
    <path d="M 50 120 C 30 180 35 240 70 255 C 80 260 120 260 130 255 C 165 240 170 180 150 120 Z" fill="url(#goldGummy)"/>
    <ellipse cx="40" cy="165" rx="22" ry="40" transform="rotate(25, 40, 165)" fill="url(#goldGummy)"/>
    <ellipse cx="160" cy="165" rx="22" ry="40" transform="rotate(-25, 160, 165)" fill="url(#goldGummy)"/>
    <ellipse cx="65" cy="255" rx="26" ry="32" fill="url(#goldGummy)"/>
    <ellipse cx="135" cy="255" rx="26" ry="32" fill="url(#goldGummy)"/>
  </g>
</svg>
