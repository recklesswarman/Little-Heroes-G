# apphosting.yaml
# Cloud Run service configuration for Little Heroes Adventures (Firebase App Hosting)

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables
env:
  - variable: VITE_FIREBASE_PROJECT_ID
    value: little-heroes-quest-8842
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: little-heroes-quest-8842.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: little-heroes-quest-8842.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  # Google Gemini API key for live voice companion and AI storybook.
  # Bound to a Secret Manager secret so it is never exposed in client URLs or bundles.
  # -- set once with: firebase apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  # Parent chore/reward alerts: the server's /api/notify posts to the family Pi's ntfy
  # through Tailscale Funnel. Publish-only token for the little-heroes topic, kept server-side.
  # -- set once with: firebase apphosting:secrets:set NTFY_TOKEN
  - variable: NTFY_URL
    value: https://meshlink.tail9d175a.ts.net
    availability:
      - RUNTIME
  - variable: NTFY_TOPIC
    value: little-heroes
    availability:
      - RUNTIME
  - variable: NTFY_TOKEN
    secret: NTFY_TOKEN
    availability:
      - RUNTIME
  # Cookie-free Umami page views on the family Pi (tracker + /api/send only, via Funnel)
  - variable: VITE_UMAMI_HOST
    value: https://meshlink.tail9d175a.ts.net/umami
    availability:
      - BUILD
  - variable: VITE_UMAMI_WEBSITE_ID
    value: 0e6c6bb6-261e-4977-9ca6-1e41d3a3f8fb
    availability:
      - BUILD
  # Rex's offline Pi voice (Piper + Whisper) relayed over Tailscale Funnel; the token
  # stays server-side. -- set once with: firebase apphosting:secrets:set PI_RELAY_TOKEN
  - variable: PI_RELAY_URL
    value: https://meshlink.tail9d175a.ts.net/pi-voice
    availability:
      - RUNTIME
  - variable: PI_RELAY_TOKEN
    secret: PI_RELAY_TOKEN
    availability:
      - RUNTIME
  # Cloudflare Workers AI free image generator for Bedtime AI Storybook
  - variable: CLOUDFLARE_IMAGE_API_URL
    value: https://little-heroes-free-image-api.recklesswarman.workers.dev
    availability:
      - RUNTIME


