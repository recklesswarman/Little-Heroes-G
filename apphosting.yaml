# apphosting.yaml
# Cloud Run service configuration for Little Heroes Adventures (Firebase App Hosting)

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables
env:
  - variable: VITE_FIREBASE_PROJECT_ID
    value: ceremonial-bongo-p9brs
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: ceremonial-bongo-p9brs.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: ceremonial-bongo-p9brs.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_DATABASE_ID
    value: ai-studio-littleheroesques-26318934-4fd1-408f-876b-52847e8f80ec
    availability:
      - BUILD
      - RUNTIME
