# apphosting.yaml
# Cloud Run service configuration for Little Heroes Adventures (Firebase App Hosting)

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables
env:
  - variable: VITE_FIREBASE_PROJECT_ID
    value: little-heroes-quest-8842
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: little-heroes-quest-8842.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: little-heroes-quest-8842.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  # Google Gemini API key for live voice companion and AI storybook.
  # Bound to a Secret Manager secret so it is never exposed in client URLs or bundles.
  # -- set once with: firebase apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  # Cloudflare Workers AI free image generator for Bedtime AI Storybook
  - variable: CLOUDFLARE_IMAGE_API_URL
    value: https://little-heroes-free-image-api.recklesswarman.workers.dev
    availability:
      - RUNTIME


