# apphosting.yaml
# Cloud Run service configuration for Little Heroes Adventures (Firebase App Hosting)

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables
env:
  - variable: VITE_FIREBASE_PROJECT_ID
    value: little-heroes-quest-8842
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: little-heroes-quest-8842.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: little-heroes-quest-8842.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  # Self-hosted Kokoro TTS microservice (little-heroes-tts-service), replacing
  # the former ElevenLabs/Gemini TTS tiers. No API key needed -- Kokoro runs
  # fully offline/locally. BUILD-scoped (and VITE_-prefixed) because this
  # origin serves the client bundle directly rather than via the
  # firebase.json `/api/tts` Hosting rewrite, so the client needs the real
  # Cloud Run URL baked in at build time. Update this value once the service
  # is deployed (see little-heroes-tts-service/README.md).
  - variable: VITE_KOKORO_TTS_URL
    value: https://little-heroes-tts-kokoro-592754457115.us-central1.run.app
    availability:
      - BUILD
  # Google Gemini API key for live voice companion and AI storybook.
  # Bound to a Secret Manager secret so it is never exposed in client URLs or bundles.
  # -- set once with: firebase apphosting:secrets:set GEMINI_API_KEY
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  # Cloudflare Workers AI free image generator for Bedtime AI Storybook
  - variable: CLOUDFLARE_IMAGE_API_URL
    value: https://little-heroes-free-image-api.recklesswarman.workers.dev
    availability:
      - RUNTIME


